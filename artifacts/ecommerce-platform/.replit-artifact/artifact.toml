kind = "web"
previewPath = "/"
title = "Ecommerce Platform"
description = "A polished ecommerce storefront where customers can browse a curated product catalog, search and filter products, view product details, manage a cart, and complete a checkout flow."
version = "1.0.0"
id = "artifacts/ecommerce-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20117

[services.development]
run = "pnpm --filter @workspace/ecommerce-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecommerce-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecommerce-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20117"
BASE_PATH = "/"
